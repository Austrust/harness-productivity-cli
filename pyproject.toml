[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-productivity-cli"
version = "0.2.2"
description = "Verified calendar and iOS Reminders CLIs for agent harnesses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "icalendar>=7,<8", "pyicloud==2.6.5", "msal>=1.32,<2", "tzdata>=2025.1", "keyring>=25.7,<26", "SecretStorage>=3.3,<4; sys_platform == 'linux'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/Austrust/harness-productivity-cli"
Issues = "https://github.com/Austrust/harness-productivity-cli/issues"

[project.scripts]
mailcal = "productivity.cli:calendar_main"
ios-reminders = "productivity.cli:reminders_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
